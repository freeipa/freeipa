topologies:
  build: &build
    name: build
    cpu: 2
    memory: 3800
  ad_master_2client: &ad_master_2client
    name: ad_master_2client
    cpu: 4
    memory: 10596
  adroot_adchild_adtree_master_1client: &adroot_adchild_adtree_master_1client
    name: adroot_adchild_adtree_master_1client
    cpu: 8
    memory: 14466
  adroot_adchild_adtree_master_2client: &adroot_adchild_adtree_master_2client
    name: adroot_adchild_adtree_master_2client
    cpu: 9
    memory: 15000

jobs:
  fedora-latest/build:
    requires: []
    priority: 150
    job:
      class: Build
      args:
        git_repo: '{git_repo}'
        git_refspec: '{git_refspec}'
        template: &ci-master-latest
          name: freeipa/ci-master-f44
          version: 0.0.1
        timeout: 1800
        topology: *build

  fedora-latest/test_smb:
    requires: [fedora-latest/build]
    priority: 50
    job:
      class: RunADTests
      args:
        build_url: '{fedora-latest/build_url}'
        test_suite: test_integration/test_smb.py::TestSMB
        template: *ci-master-latest
        timeout: 7200
        topology: *ad_master_2client

  fedora-latest/test_trust:
    requires: [fedora-latest/build]
    priority: 50
    job:
      class: RunADTests
      args:
        build_url: '{fedora-latest/build_url}'
        test_suite: test_integration/test_trust.py::TestTrust
        template: *ci-master-latest
        timeout: 7200
        topology: *adroot_adchild_adtree_master_1client

  fedora-latest/test_trust_autoprivate:
    requires: [fedora-latest/build]
    priority: 50
    job:
      class: RunADTests
      args:
        build_url: '{fedora-latest/build_url}'
        test_suite: test_integration/test_trust.py::TestNonPosixAutoPrivateGroup test_integration/test_trust.py::TestPosixAutoPrivateGroup
        template: *ci-master-latest
        timeout: 6000
        topology: *adroot_adchild_adtree_master_1client

  fedora-latest/test_trust_functional:
    requires: [fedora-latest/build]
    priority: 50
    job:
      class: RunADTests
      args:
        build_url: '{fedora-latest/build_url}'
        test_suite: test_integration/test_trust_functional.py
        template: *ci-master-latest
        timeout: 14400
        topology: *adroot_adchild_adtree_master_2client
